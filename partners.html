<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Partner Access | Gold Snipers</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            background:
                radial-gradient(1100px 520px at 50% -10%, rgba(226, 180, 90, 0.10), transparent 60%),
                #090D14;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .gate-card {
            width: 100%;
            max-width: 420px;
            background: #101622;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 26px;
            padding: 40px 34px 34px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            text-align: center;
        }
        .gate-logo { height: 40px; width: auto; margin-bottom: 22px; }
        .gate-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #E2B45A;
            background: rgba(226, 180, 90, 0.12);
            border: 1px solid rgba(226, 180, 90, 0.38);
            border-radius: 999px;
            padding: 6px 14px;
            margin-bottom: 18px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            margin: 0 0 10px;
            color: #F8FAFC;
        }
        .gate-sub {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #94A3B8;
            margin: 0 0 26px;
        }
        form { display: flex; flex-direction: column; gap: 12px; }
        input[type="password"] {
            width: 100%;
            background: #161F30;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: #F8FAFC;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.15s ease;
        }
        input[type="password"]::placeholder { color: #64748B; }
        input[type="password"]:focus { border-color: rgba(226, 180, 90, 0.5); }
        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1A1206;
            background: linear-gradient(180deg, #ECC574, #E2B45A);
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.1s ease;
        }
        button:hover { filter: brightness(1.06); }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: 0.6; cursor: default; filter: none; }
        .gate-error {
            margin: 16px 0 0;
            font-size: 0.82rem;
            color: #FCA5A5;
        }
        .gate-foot {
            margin: 24px 0 0;
            font-size: 0.76rem;
            color: #64748B;
        }
        .gate-foot a { color: #94A3B8; text-decoration: none; }
        .gate-foot a:hover { color: #E2B45A; }
    </style>
</head>
<body>
    <main class="gate-card">
        <img src="logo-header.png" alt="Gold Snipers" class="gate-logo">
        <div class="gate-badge">Partner Programme</div>
        <h1>Partner access</h1>
        <p class="gate-sub">This area is private. Enter the password you were given to view the Gold Snipers Partner Programme.</p>
        <form id="gateForm">
            <input id="gatePassword" type="password" placeholder="Partner password" autocomplete="off" autofocus required>
            <button id="gateSubmit" type="submit">Unlock</button>
        </form>
        <p id="gateError" class="gate-error" hidden>Incorrect password. Please check and try again.</p>
        <p class="gate-foot">Not a partner yet? <a href="index.html">Back to the main site</a></p>
    </main>

    <script>
        (function () {
            var SUPABASE_URL = "https://hxlqbctnkqqtueuyqyyv.supabase.co";
            var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4bHFiY3Rua3FxdHVldXlxeXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MTQ0MzUsImV4cCI6MjA5NzI5MDQzNX0.by036-Cb_1hS1Q-lcIHwbdKRIziuMfJDjVOHs6nUic8";
            var ENDPOINT = SUPABASE_URL + "/functions/v1/partner-access";

            var form = document.getElementById("gateForm");
            var input = document.getElementById("gatePassword");
            var btn = document.getElementById("gateSubmit");
            var err = document.getElementById("gateError");

            function fail(message) {
                err.textContent = message;
                err.hidden = false;
                btn.disabled = false;
                btn.textContent = "Unlock";
                input.focus();
                input.select();
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                var password = input.value;
                if (!password) return;
                err.hidden = true;
                btn.disabled = true;
                btn.textContent = "Checking\u2026";

                fetch(ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": ANON,
                        "Authorization": "Bearer " + ANON
                    },
                    body: JSON.stringify({ password: password })
                })
                    .then(function (res) {
                        return res.json().catch(function () { return {}; }).then(function (data) {
                            return { ok: res.ok, status: res.status, data: data };
                        });
                    })
                    .then(function (r) {
                        if (r.ok && r.data && r.data.ok && r.data.html) {
                            document.open();
                            document.write(r.data.html);
                            document.close();
                            return;
                        }
                        if (r.status === 429) { fail("Too many attempts. Please wait a minute and try again."); return; }
                        fail("Incorrect password. Please check and try again.");
                    })
                    .catch(function () {
                        fail("Could not verify the password. Please check your connection and try again.");
                    });
            });
        })();
    </script>
</body>
</html>
